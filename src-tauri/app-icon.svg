<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3a5c"/>
      <stop offset="1" stop-color="#0b1726"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- flight path arc: boost, coast, descent -->
  <path d="M250 800 C 300 520, 420 300, 560 250" fill="none" stroke="#ff6f1f" stroke-width="34" stroke-linecap="round"/>
  <path d="M560 250 C 660 215, 730 260, 760 340" fill="none" stroke="#ffd700" stroke-width="34" stroke-linecap="round"/>
  <path d="M760 340 C 790 470, 790 640, 780 800" fill="none" stroke="#40c0ff" stroke-width="34" stroke-linecap="round" stroke-dasharray="2 60"/>
  <!-- rocket at apogee -->
  <g transform="translate(560 250) rotate(62)">
    <path d="M0 -110 C 34 -70, 40 -20, 40 40 L -40 40 C -40 -20, -34 -70, 0 -110 Z" fill="#e8edf2"/>
    <path d="M-40 10 L -78 70 L -40 60 Z M40 10 L 78 70 L 40 60 Z" fill="#ffb547"/>
    <circle cx="0" cy="-30" r="14" fill="#1b3a5c"/>
  </g>
  <!-- pad and landing -->
  <circle cx="250" cy="800" r="30" fill="#32cd32"/>
  <circle cx="780" cy="800" r="30" fill="#ff3b3b"/>
</svg>
