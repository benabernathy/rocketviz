# Builds unsigned desktop installers for macOS (arm64), Windows (x64) and Linux (x64).
# Signing and notarization steps get added here once the secrets exist (see docs/architecture-decisions.md, §5).
name: desktop

on:
  push:
    branches: [main, tauri-pivot]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04      # oldest supported glibc, so the AppImage runs on newer distros too
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Build desktop app
        run: npx --prefix web tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: rocketviz-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
