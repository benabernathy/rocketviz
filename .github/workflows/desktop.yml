# Builds unsigned desktop installers for macOS (arm64), Windows (x64) and Linux (x64) on every push, with the
# OpenRocket engine and Java runtime bundled. Signed release builds come from release.yml.
name: desktop

on:
  push:
    branches: [main, tauri-pivot]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04      # oldest supported glibc, so the AppImage runs on newer distros too
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache OpenRocket JAR
        uses: actions/cache@v6
        with:
          path: engines/openrocket/lib
          key: openrocket-24.12-4959b72f52f5f607

      - name: Build the engine and Java runtime to bundle
        working-directory: engines/openrocket
        shell: bash
        run: ./gradlew bundle

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Build desktop app
        run: npx --prefix web tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: rocketviz-${{ matrix.name }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error
