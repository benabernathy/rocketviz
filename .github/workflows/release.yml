# Release: push a tag `vX.Y.Z` matching the version in src-tauri/tauri.conf.json. Builds installers for macOS (arm64),
# Windows (x64) and Linux (x64) and uploads them to a *draft* GitHub release with the updater's latest.json.
# Publishing the draft is what makes installed apps see the update.
#
# Secrets (each part is skipped while its secrets are missing; see docs/releasing.md):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD   update signing (required for the updater)
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY   macOS code signing (Developer ID)
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID                         macOS notarization (app-specific password)
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
          - os: windows-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [[ "${GITHUB_REF_NAME}" == "v${version}" ]] || { echo "Tag ${GITHUB_REF_NAME} doesn't match version ${version}"; exit 1; }

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and check the engine and Java runtime to bundle
        working-directory: engines/openrocket
        run: ./gradlew bundle test

      - name: macOS signing keychain, and sign the Java runtime
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          # Tauri signs the app with this identity from the keychain above; the runtime must be signed first.
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET" >> "$GITHUB_ENV"
          scripts/macos-sign-runtime.sh "$APPLE_SIGNING_IDENTITY_SECRET" engines/openrocket/build/jre
          if [[ -n "$APPLE_ID_SECRET" ]]; then
            { echo "APPLE_ID=$APPLE_ID_SECRET"; echo "APPLE_PASSWORD=$APPLE_PASSWORD_SECRET"; echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET"; } >> "$GITHUB_ENV"
          else
            echo "::warning::No notarization credentials: the macOS build is signed but not notarized."
          fi

      - name: Updater signing
        run: |
          if [[ "$HAS_UPDATER_KEY" == "true" ]]; then
            echo "TAURI_ARGS=--config src-tauri/tauri.release.conf.json" >> "$GITHUB_ENV"
          else
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY: no update packages, so installed apps won't see this release."
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install web dependencies
        run: npm ci --prefix web

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx --prefix web tauri
          args: ${{ env.TAURI_ARGS }}
          tagName: ${{ github.ref_name }}
          releaseName: rocketviz ${{ github.ref_name }}
          releaseDraft: true
          generateReleaseNotes: true
          uploadUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
          updaterJsonPreferNsis: true

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SHA-256 checksums of the release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY"
          sha256sum -- * | grep -v "latest.json" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"
