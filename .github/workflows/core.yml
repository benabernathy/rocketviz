# Rust core: unit tests, plus integration tests against the real OpenRocket engine, on every v1 platform.
name: core

on:
  push:
    branches: [main, tauri-pivot]
    paths: ["crates/**", "engines/openrocket/**", "Cargo.toml", "Cargo.lock", ".github/workflows/core.yml"]
  pull_request:
    paths: ["crates/**", "engines/openrocket/**", "Cargo.toml", "Cargo.lock", ".github/workflows/core.yml"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache OpenRocket JAR
        uses: actions/cache@v6
        with:
          path: engines/openrocket/lib
          key: openrocket-24.12-4959b72f52f5f607

      - name: Build the OpenRocket engine
        working-directory: engines/openrocket
        run: ./gradlew assembleEngine

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format and lint
        run: |
          cargo fmt -p rocketviz-core --check
          cargo clippy -p rocketviz-core --all-targets -- -D warnings

      - name: Test
        env:
          ROCKETVIZ_REQUIRE_ENGINE: "1"
        run: cargo test -p rocketviz-core
