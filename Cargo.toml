[workspace]
members = ["crates/core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Benjamin Abernathy"]
repository = "https://github.com/benabernathy/rocketviz"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
tracing = "0.1.44"
