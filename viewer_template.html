<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__ Flight Globe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Widgets/widgets.css">
<style>
/* Layout: full-bleed globe; one instrument panel docked left (bottom sheet on phones); transport bar along the bottom. */
:root {
  --panel: rgba(16, 22, 30, 0.88);
  --panel-solid: #10161e;
  --line: rgba(160, 182, 204, 0.18);
  --ink: #e8edf2;
  --muted: #93a3b4;
  --signal: #ffb547;      /* accent: launch-control amber */
  --boost: #ff6f1f;
  --coast: #ffd700;
  --descent: #40c0ff;
  --ok: #4fd18b; --warn: #ffd23f; --bad: #ff5a5a;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--panel-solid); color: var(--ink); font: 14px/1.45 var(--f-body); }
#globe { position: fixed; inset: 0; }
.cesium-viewer-bottom { left: auto !important; right: 8px; bottom: 64px !important; }
.cesium-credit-logoContainer { display: none !important; }

aside {
  position: fixed; top: 12px; left: 12px; width: 330px; max-height: calc(100% - 96px);
  overflow: auto; background: var(--panel); backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column;
}
aside section { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
aside section:last-child { border-bottom: 0; }
h1 { font: 600 26px/1 var(--f-display); letter-spacing: .02em; margin: 0; text-transform: uppercase; }
h1 small { display: block; font: 500 12px/1.4 var(--f-data); color: var(--muted); letter-spacing: 0; text-transform: none; margin-top: 6px; }
h2 { font: 600 13px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }

.seg { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { flex: 1; background: transparent; color: var(--muted); border: 0; padding: 8px 6px; font: 600 15px var(--f-display); letter-spacing: .05em; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--signal); color: #1a1205; }

.readout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.readout div { display: grid; gap: 2px; }
.readout b { font: 500 22px/1 var(--f-data); font-variant-numeric: tabular-nums; }
.readout span, .kv dt { font: 500 11px var(--f-data); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.phase { display: inline-flex; align-items: center; gap: 6px; font: 600 14px var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.phase i { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; }
.kv dd { margin: 0; font: 400 13px var(--f-data); font-variant-numeric: tabular-nums; text-align: right; }
.kv dd.big { font-size: 16px; color: var(--signal); }

.toggles { display: grid; gap: 6px; }
.toggles label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.toggles input { accent-color: var(--signal); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 12px var(--f-data); color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 5px; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.mini { background: transparent; border: 1px solid var(--line); color: var(--ink); border-radius: 4px; padding: 6px 10px; font: 500 12px var(--f-data); cursor: pointer; }
.mini:hover, .seg button:hover { color: var(--ink); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

.bar {
  position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 12px; padding: 8px 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(8px);
}
.bar .play { width: 40px; height: 32px; border-radius: 4px; border: 0; background: var(--signal); color: #1a1205; font: 600 15px var(--f-display); cursor: pointer; }
.bar input[type=range] { flex: 1; min-width: 0; accent-color: var(--signal); }
.bar .t { font: 500 14px var(--f-data); font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
.bar select { background: var(--panel-solid); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; font: 12px var(--f-data); padding: 5px; }
#err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
#err[hidden] { display: none; }
#err code { font: 13px var(--f-data); color: var(--ink); background: var(--panel); padding: 2px 6px; border-radius: 4px; }

@media (max-width: 720px) {
  aside { top: auto; left: 8px; right: 8px; width: auto; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); max-height: 38%; }
  .bar { left: 8px; right: 8px; }
}
</style>
</head>
<body>
<div id="globe"></div>
<div id="err" hidden></div>

<aside>
  <section>
    <h1 id="rname">Rocket<small id="site">—</small></h1>
    <div class="seg" id="simseg" role="group" aria-label="Motor configuration"></div>
  </section>
  <section>
    <div class="phase" id="phase"><i></i><span>On pad</span></div>
    <div class="readout">
      <div><b id="r-alt">0</b><span>Alt m AGL</span></div>
      <div><b id="r-vel">0</b><span>Speed m/s</span></div>
      <div><b id="r-dr">0</b><span>Drift m</span></div>
    </div>
  </section>
  <section>
    <h2>Recovery</h2>
    <dl class="kv" id="kv"></dl>
  </section>
  <section>
    <h2>Layers</h2>
    <div class="toggles">
      <label><input type="checkbox" id="t-mc" checked> Monte Carlo landings</label>
      <label><input type="checkbox" id="t-ell" checked> 1σ / 2σ / 3σ landing zones</label>
      <label><input type="checkbox" id="t-sweep"> Wind sweep (0 → max m/s)</label>
      <label><input type="checkbox" id="t-follow"> Camera follows rocket</label>
    </div>
    <div class="legend">
      <span><i style="background:var(--boost)"></i>Boost</span>
      <span><i style="background:var(--coast)"></i>Coast</span>
      <span><i style="background:var(--descent)"></i>Descent</span>
    </div>
  </section>
  <section>
    <h2>Launch site</h2>
    <p class="hint">Double-click the map to move the pad. The flight shifts with it; the physics stay as simulated.</p>
    <div style="display:flex; gap:8px; flex-wrap:wrap">
      <button class="mini" id="b-reset">Reset to .ork site</button>
      <button class="mini" id="b-view">Frame flight</button>
    </div>
  </section>
</aside>

<div class="bar">
  <button class="play" id="play" aria-label="Play">▶</button>
  <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Flight time">
  <span class="t" id="tclock">T+0.0 s</span>
  <select id="speed" aria-label="Playback speed">
    <option value="1">1×</option><option value="4" selected>4×</option><option value="10">10×</option><option value="30">30×</option>
  </select>
</div>

<script>window.CESIUM_BASE_URL = "https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/";</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Cesium.js"></script>
<script>
const DATA = __DATA__;
const R = 6371000;
const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const compass = b => COMPASS[Math.floor(((b + 11.25) % 360) / 22.5)];
const bearing = (e, n) => (Math.atan2(e, n) * 180 / Math.PI + 360) % 360;
const ft = m => Math.round(m * 3.28084).toLocaleString();

let simIdx = 0, pad = { ...DATA.pad }, playing = false, tNow = 0, lastFrame = null;
const $ = id => document.getElementById(id);

// Cesium builds the globe and line geometry in module web workers, which browsers won't start from a file:// page.
if (location.protocol === "file:") {
  const f = decodeURIComponent(location.pathname.split("/").pop());
  $("err").hidden = false;
  $("err").innerHTML = `<div>This viewer has to be served over http; browsers block CesiumJS's workers on file:// pages.<br><br>From the orviz folder, run <code>uv run orviz.py ${f} --serve</code></div>`;
  document.querySelectorAll("aside, .bar").forEach(el => el.style.display = "none");
  throw new Error("file:// not supported");
}
if (typeof Cesium === "undefined") {
  $("err").hidden = false;
  $("err").textContent = "Couldn't load CesiumJS from cdn.jsdelivr.net. This viewer needs an internet connection.";
  throw new Error("no cesium");
}

const viewer = new Cesium.Viewer("globe", {
  baseLayer: new Cesium.ImageryLayer(new Cesium.UrlTemplateImageryProvider({
    url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    maximumLevel: 19, credit: "Imagery © Esri, Maxar, Earthstar Geographics"
  })),
  terrainProvider: new Cesium.EllipsoidTerrainProvider(),
  baseLayerPicker: false, geocoder: false, timeline: false, animation: false, homeButton: false,
  sceneModePicker: false, navigationHelpButton: false, fullscreenButton: false,
  infoBox: false, selectionIndicator: false, shouldAnimate: false,
});
viewer.scene.globe.depthTestAgainstTerrain = false;
viewer.scene.skyAtmosphere.show = true;
viewer.cesiumWidget.screenSpaceEventHandler.removeInputAction(Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);

const C = {
  boost: Cesium.Color.fromCssColorString("#ff6f1f"),
  coast: Cesium.Color.fromCssColorString("#ffd700"),
  descent: Cesium.Color.fromCssColorString("#40c0ff"),
  signal: Cesium.Color.fromCssColorString("#ffb547"),
};

// local ENU (m) -> Cartesian3 at height h above ellipsoid (ground = 0 here)
function enu(e, n, h = 0) {
  const lat = pad.lat + (n / R) * 180 / Math.PI;
  const lon = pad.lon + (e / (R * Math.cos(pad.lat * Math.PI / 180))) * 180 / Math.PI;
  return Cesium.Cartesian3.fromDegrees(lon, lat, Math.max(h, 0));
}

function evTime(s, type) { const e = s.events.find(e => e.type === type); return e ? e.t : null; }
function idxAt(s, t) { let lo = 0, hi = s.t.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (s.t[m] < t) lo = m + 1; else hi = m; } return lo; }
function lerp(s, key, t) {
  const i = idxAt(s, t); if (i === 0) return s[key][0];
  const t0 = s.t[i - 1], t1 = s.t[i], f = t1 > t0 ? (t - t0) / (t1 - t0) : 0;
  return s[key][i - 1] + (s[key][i] - s[key][i - 1]) * f;
}
function phaseAt(s, t) {
  if (t <= (evTime(s, "LIFTOFF") ?? 0)) return ["On pad", "#93a3b4"];
  if (t < (evTime(s, "BURNOUT") ?? 0)) return ["Boost", "#ff6f1f"];
  if (t < (evTime(s, "RECOVERY_DEVICE_DEPLOYMENT") ?? evTime(s, "APOGEE"))) return ["Coast", "#ffd700"];
  if (t < s.t[s.t.length - 1]) return ["Under chute", "#40c0ff"];
  return ["Landed", "#4fd18b"];
}

let ents = [];
function clear() { ents.forEach(e => viewer.entities.remove(e)); ents = []; }
const add = o => { const e = viewer.entities.add(o); ents.push(e); return e; };
const groups = { mc: [], ell: [], sweep: [] };

function ellipse(pts, k) {
  const n = pts.length, me = pts.reduce((a, p) => a + p[0], 0) / n, mn = pts.reduce((a, p) => a + p[1], 0) / n;
  let a = 0, b = 0, c = 0;
  pts.forEach(([e, m]) => { a += (e - me) ** 2; b += (e - me) * (m - mn); c += (m - mn) ** 2; });
  a /= n - 1; b /= n - 1; c /= n - 1;
  const tr = a + c, det = a * c - b * b, l1 = tr / 2 + Math.sqrt(tr * tr / 4 - det), l2 = tr / 2 - Math.sqrt(tr * tr / 4 - det);
  const ang = Math.atan2(l1 - a, b);
  const out = [];
  for (let i = 0; i <= 72; i++) {
    const th = i / 72 * 2 * Math.PI, x = k * Math.sqrt(l1) * Math.cos(th), y = k * Math.sqrt(Math.max(l2, 0)) * Math.sin(th);
    out.push([me + x * Math.cos(ang) - y * Math.sin(ang), mn + x * Math.sin(ang) + y * Math.cos(ang)]);
  }
  return { ring: out, axes: [k * Math.sqrt(l1), k * Math.sqrt(Math.max(l2, 0))] };
}

let rocket, s;
function build() {
  clear(); groups.mc = []; groups.ell = []; groups.sweep = [];
  s = DATA.sims[simIdx];
  const N = s.t.length - 1;
  const tl = evTime(s, "LIFTOFF") ?? 0, tb = evTime(s, "BURNOUT") ?? tl, td = evTime(s, "RECOVERY_DEVICE_DEPLOYMENT") ?? evTime(s, "APOGEE");
  const seg = [["boost", idxAt(s, tl), idxAt(s, tb)], ["coast", idxAt(s, tb), idxAt(s, td)], ["descent", idxAt(s, td), N]];
  seg.forEach(([k, a, b]) => {
    if (b <= a) return;
    const pos = []; for (let i = a; i <= b; i++) pos.push(enu(s.e[i], s.n[i], s.alt[i]));
    add({ polyline: { positions: pos, width: 3, material: C[k] } });
    const wall = pos.filter((_, j) => j % Math.max(1, Math.floor(pos.length / 300)) === 0);
    add({ wall: { positions: wall, material: C[k].withAlpha(0.13), outline: false } });
  });

  // pad, landing, recovery line
  add({ position: enu(0, 0), point: { pixelSize: 11, color: Cesium.Color.LIME, outlineColor: Cesium.Color.BLACK, outlineWidth: 2 },
        label: lbl("PAD", -18) });
  const le = s.e[N], ln = s.n[N], dist = Math.hypot(le, ln), brg = bearing(le, ln);
  add({ position: enu(le, ln), point: { pixelSize: 12, color: Cesium.Color.RED, outlineColor: Cesium.Color.WHITE, outlineWidth: 2 },
        label: lbl(`LANDING  ${Math.round(dist)} m ${compass(brg)}`, -18) });
  add({ polyline: { positions: [enu(0, 0, 0.5), enu(le, ln, 0.5)], width: 3, clampToGround: true,
        material: new Cesium.PolylineDashMaterialProperty({ color: Cesium.Color.RED, dashLength: 14 }) } });

  // events
  const tApo = evTime(s, "APOGEE");
  for (const ev of s.events) {
    let name = { BURNOUT: "Burnout", APOGEE: "Apogee", RECOVERY_DEVICE_DEPLOYMENT: "Deploy" }[ev.type];
    if (!name) continue;
    const closeDeploy = tdep => tdep != null && tApo != null && Math.abs(tdep - tApo) < 2;
    if (ev.type === "RECOVERY_DEVICE_DEPLOYMENT" && closeDeploy(ev.t)) continue;
    if (ev.type === "APOGEE" && closeDeploy(evTime(s, "RECOVERY_DEVICE_DEPLOYMENT"))) name = "Apogee + deploy";
    const i = idxAt(s, ev.t);
    add({ position: enu(s.e[i], s.n[i], s.alt[i]), point: { pixelSize: 7, color: Cesium.Color.WHITE },
          label: lbl(`${name} T+${ev.t.toFixed(1)}s · ${Math.round(s.alt[i])} m`, 0, 12) });
  }

  // wind arrow at pad: points downwind, 1 m/s = 25 m
  const c = s.conditions, wl = Math.max(30, c.wind_speed * 25), dto = (c.wind_dir_deg + 180) * Math.PI / 180;
  add({ polyline: { positions: [enu(0, 0, 1), enu(Math.sin(dto) * wl, Math.cos(dto) * wl, 1)], width: 12, clampToGround: true,
        material: new Cesium.PolylineArrowMaterialProperty(C.signal.withAlpha(0.85)) } });

  // Monte Carlo
  const pts = s.mc.map(m => [m.e, m.n]);
  if (pts.length > 2) {
    [[3, Cesium.Color.RED], [2, Cesium.Color.YELLOW], [1, Cesium.Color.LIME]].forEach(([k, col]) => {
      const { ring } = ellipse(pts, k);
      groups.ell.push(add({ polygon: { hierarchy: ring.map(([e, n]) => enu(e, n)), material: col.withAlpha(0.10), classificationType: Cesium.ClassificationType.TERRAIN } }));
      groups.ell.push(add({ polyline: { positions: ring.map(([e, n]) => enu(e, n)), width: 2, clampToGround: true, material: col } }));
    });
    s.mc.forEach(m => groups.mc.push(add({ position: enu(m.e, m.n), point: { pixelSize: 5, color: Cesium.Color.WHITE.withAlpha(0.85), outlineColor: Cesium.Color.BLACK, outlineWidth: 1 } })));
  }
  const sw = s.sweep.map(w => enu(w.e, w.n));
  groups.sweep.push(add({ polyline: { positions: [enu(0, 0), ...sw], width: 2, clampToGround: true, material: Cesium.Color.CYAN.withAlpha(0.7) } }));
  s.sweep.forEach(w => { if (w.wind > 0) groups.sweep.push(add({ position: enu(w.e, w.n), point: { pixelSize: 6, color: Cesium.Color.CYAN },
        label: lbl(`${w.wind} m/s → ${Math.round(Math.hypot(w.e, w.n))} m`, 0, 10) })); });

  // rocket marker
  rocket = add({ position: enu(0, 0), point: { pixelSize: 14, color: C.signal, outlineColor: Cesium.Color.BLACK, outlineWidth: 2,
        disableDepthTestDistance: Number.POSITIVE_INFINITY } });
  applyToggles(); fillPanel(); setT(0);
}

function lbl(text, dy = 0, dx = 0) {
  return { text, font: "500 13px 'IBM Plex Mono', monospace", fillColor: Cesium.Color.WHITE, outlineColor: Cesium.Color.BLACK, outlineWidth: 3,
    style: Cesium.LabelStyle.FILL_AND_OUTLINE, pixelOffset: new Cesium.Cartesian2(dx, dy), horizontalOrigin: dx ? Cesium.HorizontalOrigin.LEFT : Cesium.HorizontalOrigin.CENTER,
    verticalOrigin: Cesium.VerticalOrigin.BOTTOM, disableDepthTestDistance: Number.POSITIVE_INFINITY, scale: 0.9 };
}

function applyToggles() {
  groups.mc.forEach(e => e.show = $("t-mc").checked);
  groups.ell.forEach(e => e.show = $("t-ell").checked);
  groups.sweep.forEach(e => e.show = $("t-sweep").checked);
}

function fillPanel() {
  const N = s.t.length - 1, c = s.conditions, m = s.summary;
  const dist = Math.hypot(s.e[N], s.n[N]), brg = bearing(s.e[N], s.n[N]);
  const d = s.mc.map(x => Math.hypot(x.e, x.n)).sort((a, b) => a - b);
  const pct = p => d.length ? Math.round(d[Math.min(d.length - 1, Math.floor(p * d.length))]) : "—";
  const ell = s.mc.length > 2 ? ellipse(s.mc.map(x => [x.e, x.n]), 2).axes : null;
  const rows = [
    ["Walk to rocket", `${Math.round(dist)} m · ${ft(dist)} ft`, true],
    ["Direction", `${Math.round(brg)}° ${compass(brg)}`],
    ["Apogee", `${Math.round(m.max_alt)} m · ${ft(m.max_alt)} ft`],
    ["Flight time", `${m.flight_t.toFixed(0)} s`],
    ["Landing speed", `${m.ground_v.toFixed(1)} m/s`],
    ["Off-rod speed", `${m.rod_v.toFixed(1)} m/s`],
    ["Wind", `${c.wind_speed.toFixed(1)} m/s from ${Math.round(c.wind_dir_deg)}° ${compass(c.wind_dir_deg)}`],
    [`MC drift (n=${d.length})`, `${pct(0.5)} m med · ${pct(0.9)} m p90`],
    ["2σ zone", ell ? `${Math.round(ell[0] * 2)} × ${Math.round(ell[1] * 2)} m` : "—"],
  ];
  $("kv").innerHTML = rows.map(([k, v, big]) => `<dt>${k}</dt><dd${big ? ' class="big"' : ""}>${v}</dd>`).join("");
  $("site").textContent = `${pad.lat.toFixed(5)}, ${pad.lon.toFixed(5)} · ${s.name.split("—").pop().trim()}`;
  $("scrub").max = Math.round(s.t[N] * 10);
}

function setT(t) {
  const N = s.t.length - 1;
  tNow = Math.max(0, Math.min(t, s.t[N]));
  const e = lerp(s, "e", tNow), n = lerp(s, "n", tNow), h = lerp(s, "alt", tNow), v = lerp(s, "v", tNow);
  rocket.position = enu(e, n, h);
  $("r-alt").textContent = Math.round(h);
  $("r-vel").textContent = v.toFixed(1);
  $("r-dr").textContent = Math.round(Math.hypot(e, n));
  const [ph, col] = phaseAt(s, tNow);
  $("phase").querySelector("span").textContent = ph;
  $("phase").querySelector("i").style.background = col;
  $("tclock").textContent = `T+${tNow.toFixed(1)} s`;
  $("scrub").value = Math.round(tNow * 10);
  if ($("t-follow").checked) viewer.camera.lookAt(enu(e, n, h), new Cesium.HeadingPitchRange(0.6, -0.35, Math.max(250, h * 1.4)));
}

function frame() {
  viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
  const N = s.t.length - 1;
  const pts = [[0, 0, 0], [s.e[N], s.n[N], 0]];
  for (let i = 0; i < s.t.length; i += 10) pts.push([s.e[i], s.n[i], s.alt[i]]);
  s.mc.forEach(m => pts.push([m.e, m.n, 0]));
  const bs = Cesium.BoundingSphere.fromPoints(pts.map(p => enu(...p)));
  viewer.camera.flyToBoundingSphere(bs, { duration: 1.2, offset: new Cesium.HeadingPitchRange(-0.35, -0.42, bs.radius * 2.6) });
}

function loop(ts) {
  if (playing) {
    if (lastFrame != null) setT(tNow + (ts - lastFrame) / 1000 * +$("speed").value);
    if (tNow >= s.t[s.t.length - 1]) togglePlay(false);
  }
  lastFrame = ts; requestAnimationFrame(loop);
}
function togglePlay(on = !playing) {
  if (on && tNow >= s.t[s.t.length - 1]) setT(0);
  playing = on; $("play").textContent = on ? "❚❚" : "▶"; $("play").setAttribute("aria-label", on ? "Pause" : "Play");
}

// UI
$("rname").firstChild.textContent = DATA.rocket;
DATA.sims.forEach((sim, i) => {
  const b = document.createElement("button");
  b.textContent = sim.name.split("—").pop().replace(/[\[\]]/g, "").trim();
  b.setAttribute("aria-pressed", i === simIdx);
  b.onclick = () => { simIdx = i; [...$("simseg").children].forEach((x, j) => x.setAttribute("aria-pressed", j === i)); togglePlay(false); build(); frame(); };
  $("simseg").appendChild(b);
});
$("play").onclick = () => togglePlay();
$("scrub").oninput = e => { togglePlay(false); setT(e.target.value / 10); };
["t-mc", "t-ell", "t-sweep"].forEach(id => $(id).onchange = applyToggles);
$("t-follow").onchange = () => { if (!$("t-follow").checked) frame(); else setT(tNow); };
$("b-view").onclick = () => { $("t-follow").checked = false; frame(); };
$("b-reset").onclick = () => { pad = { ...DATA.pad }; build(); frame(); };
new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas).setInputAction(ev => {
  const cart = viewer.camera.pickEllipsoid(ev.position);
  if (!cart) return;
  const c = Cesium.Cartographic.fromCartesian(cart);
  pad = { lat: Cesium.Math.toDegrees(c.latitude), lon: Cesium.Math.toDegrees(c.longitude) };
  build(); frame();
}, Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);
document.addEventListener("keydown", e => { if (e.code === "Space" && e.target.tagName !== "INPUT") { e.preventDefault(); togglePlay(); } });

build();
viewer.camera.setView({ destination: Cesium.Cartesian3.fromDegrees(pad.lon, pad.lat, 9e6) });
setTimeout(frame, 400);
requestAnimationFrame(loop);
</script>
</body>
</html>
